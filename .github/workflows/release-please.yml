name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          archive="dist/ran-booster-wp-pusher-migrator-${version}.zip"
          test "${TAG_NAME}" = "v${version}"
          test "$(git tag --points-at HEAD --list "${TAG_NAME}")" = "${TAG_NAME}"
          test "$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ran-booster-wp-pusher-migrator.php)" = "${version}"
          test "$(node -p "require('./package.json').version")" = "${version}"
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile
          pnpm check
          composer check
          first_hash="$(shasum -a 256 "${archive}" | awk '{ print $1 }')"
          composer archive:build
          second_hash="$(shasum -a 256 "${archive}" | awk '{ print $1 }')"
          test "${first_hash}" = "${second_hash}"
          composer archive:verify
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          test "$(gh release view "${TAG_NAME}" \
            --json isPrerelease \
            --jq '.isPrerelease' \
            --repo "${GITHUB_REPOSITORY}")" = 'true'
          gh release upload "${TAG_NAME}" \
            "dist/ran-booster-wp-pusher-migrator-${version}.zip" \
            "dist/ran-booster-wp-pusher-migrator-${version}.zip.sha256" \
            "dist/ran-booster-wp-pusher-migrator-${version}.json" \
            --repo "${GITHUB_REPOSITORY}"
