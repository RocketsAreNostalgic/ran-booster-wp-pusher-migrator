name: Release Please

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: RocketsAreNostalgic/.github/.github/workflows/release-profile-b.yml@cafe0e7d2c6707c29a5aa278cb5667a1290ef7c1
    with:
      expected-workflow-path: .github/workflows/quality.yml
      release-pr-head: release-please--branches--main--components--ran-booster-wp-pusher-migrator
      artifact-prefix: ran-booster-wp-pusher-migrator-runtime
