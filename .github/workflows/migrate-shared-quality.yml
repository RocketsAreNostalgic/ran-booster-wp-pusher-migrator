name: Migrate shared quality profile

on:
  push:
    branches:
      - chore/adopt-shared-quality-profile

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/adopt-shared-quality-profile
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Refresh only shared PHP quality locks
        run: |
          composer update \
            ran/coding-standards \
            phpcompatibility/php-compatibility \
            phpcompatibility/phpcompatibility-paragonie \
            phpcompatibility/phpcompatibility-wp \
            --with-all-dependencies \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Refresh frontend lockfile only
        run: pnpm install --lockfile-only

      - name: Materialize permanent quality workflow candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def expr(value: str) -> str:
              return '$' + '{{ ' + value + ' }}'

          path = Path('.github/workflows/quality.yml')
          text = path.read_text()

          marker = 'jobs:\n  runtime-archive:\n'
          replacement = '\n'.join([
              'jobs:',
              '  baseline:',
              '    name: baseline',
              '    if: ' + expr("github.event_name == 'pull_request'"),
              '    uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d',
              '    with:',
              "      php-version: '8.2'",
              "      pnpm-version: '11.13.1'",
              '',
              '  runtime-archive:',
              '',
          ])
          if text.count(marker) != 1:
              raise SystemExit('Expected one jobs/runtime-archive insertion point.')
          text = text.replace(marker, replacement, 1)

          checkout = '''      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
'''
          checkout_exact = '\n'.join([
              '      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2',
              '        with:',
              '          persist-credentials: false',
              '          ref: ' + expr("github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha"),
              '',
          ])
          quality_start = text.index('  quality:\n')
          quality_text = text[quality_start:]
          if quality_text.count(checkout) < 1:
              raise SystemExit('Expected Quality checkout block.')
          before, after = text[:quality_start], text[quality_start:]
          after = after.replace(checkout, checkout_exact, 1)
          text = before + after

          terminal = '\n'.join([
              '',
              '  terminal-quality:',
              '    name: quality',
              '    if: ' + expr("always() && github.event_name == 'pull_request'"),
              '    needs:',
              '      - baseline',
              '      - runtime-archive',
              '      - core-contract',
              '      - quality',
              '    runs-on: ubuntu-latest',
              '    timeout-minutes: 5',
              '    steps:',
              '      - name: Require shared and repository quality lanes',
              '        env:',
              '          RAN_BASELINE_RESULT: ' + expr('needs.baseline.result'),
              '          RAN_RUNTIME_ARCHIVE_RESULT: ' + expr("needs['runtime-archive'].result"),
              '          RAN_CORE_CONTRACT_RESULT: ' + expr("needs['core-contract'].result"),
              '          RAN_REPOSITORY_QUALITY_RESULT: ' + expr('needs.quality.result'),
              '        run: |',
              '          set -euo pipefail',
              '          test "$RAN_BASELINE_RESULT" = success',
              '          test "$RAN_RUNTIME_ARCHIVE_RESULT" = success',
              '          test "$RAN_CORE_CONTRACT_RESULT" = success',
              '          test "$RAN_REPOSITORY_QUALITY_RESULT" = success',
              '',
          ])
          text = text.rstrip() + '\n' + terminal
          Path('quality.yml.patched').write_text(text)
          PY

          grep -F 'quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d' quality.yml.patched
          grep -F 'pnpm-version:' quality.yml.patched
          grep -F 'terminal-quality:' quality.yml.patched
          grep -F 'name: quality' quality.yml.patched

      - name: Prove locked permanent contracts
        run: |
          set -euo pipefail
          rm -rf vendor node_modules dist
          composer validate --strict --no-check-publish --no-check-all
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile
          test "$(pnpm --version)" = '11.13.1'
          composer check
          pnpm check

      - name: Commit only generated migration artifacts
        run: |
          set -euo pipefail
          rm -rf vendor node_modules dist
          changed="$(git status --short | awk '{print $2}')"
          for path in $changed; do
            case "$path" in
              composer.lock|pnpm-lock.yaml|quality.yml.patched) ;;
              *) echo "Unexpected migration change: $path" >&2; exit 1 ;;
            esac
          done
          git add composer.lock pnpm-lock.yaml quality.yml.patched
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: materialize shared quality migration'
          git push origin HEAD:chore/adopt-shared-quality-profile
