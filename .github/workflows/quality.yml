name: Quality

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Exact Release Please pull-request number; reserved for the trusted release workflow.
        required: true
        type: string
      release_sha:
        description: Exact Release Please head SHA; reserved for the trusted release workflow.
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    if: ${{ github.event_name == 'pull_request' }}
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d
    with:
      php-version: '8.2'
      pnpm-version: '11.13.1'

  runtime-archive:
    name: Runtime archive
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
      core-commit: ${{ steps.archive.outputs.core-commit }}
      core-tag: ${{ steps.archive.outputs.core-tag }}
      release-candidate: ${{ steps.archive.outputs.release-candidate }}
      source-commit: ${{ steps.archive.outputs.source-commit }}
      version: ${{ steps.archive.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build and verify the runtime archive once
        id: archive
        shell: bash
        env:
          RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
          RAN_DISPATCH_RELEASE_PR: ${{ inputs.release_pr }}
          RAN_DISPATCH_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          release_branch='release-please--branches--main--components--ran-booster-wp-pusher-migrator'
          release_candidate=false
          source_commit="$RAN_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$source_commit"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$RAN_DISPATCH_RELEASE_PR" =~ ^[1-9][0-9]*$ ]]
            [[ "$RAN_DISPATCH_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_ACTOR" == 'github-actions[bot]' && "$GITHUB_TRIGGERING_ACTOR" == 'github-actions[bot]' ]] \
              || { echo '::error::Only the trusted Release Please workflow may dispatch a candidate run.'; exit 1; }

            release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_DISPATCH_RELEASE_PR}")"
            jq -e \
              --arg base main \
              --arg bot 'github-actions[bot]' \
              --arg head "$release_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              '.state == "open"
                and .merged_at == null
                and .base.ref == $base
                and .head.ref == $head
                and .head.repo.full_name == $repository
                and .user.login == $bot
                and any(.labels[]?; .name == "autorelease: pending")' \
              <<< "$release_pr" >/dev/null

            base_sha="$(jq -er '.base.sha' <<< "$release_pr")"
            head_sha="$(jq -er '.head.sha' <<< "$release_pr")"
            test "$head_sha" = "$RAN_DISPATCH_RELEASE_SHA"
            test "$head_sha" = "$GITHUB_SHA"
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              bash scripts/fetch-release-candidate-ref.sh origin "$base_sha"
            fi
            bash scripts/fetch-release-candidate-ref.sh origin "refs/pull/${RAN_DISPATCH_RELEASE_PR}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$head_sha"
            bash scripts/validate-release-candidate.sh "$base_sha" "$head_sha"
            release_candidate=true
            source_commit="$head_sha"
          fi

          if [[ "$release_candidate" == true ]]; then
            test "$(git rev-parse "${source_commit}^{commit}")" = "$source_commit"
          elif [[ "$GITHUB_EVENT_NAME" == push ]] \
            && ! git diff --quiet "${GITHUB_SHA}^1" "$GITHUB_SHA" -- .release-please-manifest.json; then
            source_commit="$(git rev-parse "${GITHUB_SHA}^2")"
            test "$(git log -1 --format=%H "$GITHUB_SHA" -- .release-please-manifest.json)" = "$source_commit"
            test "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse "${source_commit}^{tree}")"
          fi
          git checkout --detach "$source_commit"

          version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ran-booster-wp-pusher-migrator.php)"
          test -n "$version"
          test "$(jq -er '."."' .release-please-manifest.json)" = "$version"
          test "$(node -p "require('./package.json').version")" = "$version"
          certification="$(php scripts/core-certification.php read composer.json)"
          core_tag="$(jq -er '.tag' <<< "$certification")"
          core_commit="$(jq -er '.commit' <<< "$certification")"
          bash scripts/build-release.sh "$source_commit"

          archive="dist/ran-booster-wp-pusher-migrator-${version}.zip"
          archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
          artifact_name="ran-booster-wp-pusher-migrator-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg quality_commit "$GITHUB_SHA" \
            --arg source_commit "$source_commit" \
            --arg version "$version" \
            --arg sha256 "$archive_sha256" \
            '{
              schema: "ran-booster-wp-pusher-migrator-ci-runtime",
              schema_version: 1,
              quality_commit: $quality_commit,
              source_commit: $source_commit,
              version: $version,
              sha256: $sha256
            }' \
            > dist/ran-booster-wp-pusher-migrator-ci-runtime.json

          {
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'archive-sha256=%s\n' "$archive_sha256"
            printf 'core-commit=%s\n' "$core_commit"
            printf 'core-tag=%s\n' "$core_tag"
            printf 'release-candidate=%s\n' "$release_candidate"
            printf 'source-commit=%s\n' "$source_commit"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the verified runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: |
            dist/ran-booster-wp-pusher-migrator-${{ steps.archive.outputs.version }}.zip
            dist/ran-booster-wp-pusher-migrator-${{ steps.archive.outputs.version }}.zip.sha256
            dist/ran-booster-wp-pusher-migrator-${{ steps.archive.outputs.version }}.json
            dist/ran-booster-wp-pusher-migrator-ci-runtime.json
          if-no-files-found: error
          retention-days: 7

  core-contract:
    name: Certified Core contract
    needs: runtime-archive
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out the exact Migrator source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.runtime-archive.outputs.source-commit }}
          path: migrator
          persist-credentials: false

      - name: Check out the certified Core source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          ref: ${{ needs.runtime-archive.outputs.core-commit }}
          fetch-depth: 0
          path: core
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify the exact Core tag, commit and API 2 surfaces
        shell: bash
        run: |
          set -euo pipefail
          php migrator/scripts/core-certification.php verify migrator/composer.json core
          grep -Eq "define\\([[:space:]]*'RAN_BOOSTER_PORTABILITY_API_VERSION'[[:space:]]*,[[:space:]]*PortabilityFacade::API_VERSION[[:space:]]*\\)" core/ran-booster.php
          grep -Eq "define\\([[:space:]]*'RAN_BOOSTER_ADMIN_INTERACTION_API_VERSION'[[:space:]]*,[[:space:]]*2[[:space:]]*\\)" core/ran-booster.php
          grep -Fq "do_action( 'ran_booster_portability_ready', \$portability )" core/ran-booster.php
          grep -Fq "do_action( 'ran_booster_admin_interaction_ready', \$adminInteraction )" core/ran-booster.php
          grep -Eq 'public const API_VERSION[[:space:]]*=[[:space:]]*2;' core/RAN/AddOn/Portability/PortabilityFacade.php
          grep -Eq 'public const API_VERSION[[:space:]]*=[[:space:]]*2;' core/RAN/Admin/Interaction/AdminInteractionFacade.php
          if grep -R -Fq 'RAN_BOOSTER_LOGGING_API_VERSION' core/ran-booster.php core/RAN; then
            exit 1
          fi
          if grep -R -Fq 'LoggingFacade' core/ran-booster.php core/RAN; then
            exit 1
          fi

  quality:
    name: Quality
    needs:
      - runtime-archive
      - core-contract
    if: ${{ needs.runtime-archive.outputs.release-candidate != 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run non-archive Composer quality gates
        run: |
          composer lint:php
          composer standards
          composer test

  terminal-quality:
    name: quality
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - baseline
      - runtime-archive
      - core-contract
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require shared and repository quality lanes
        env:
          RAN_BASELINE_RESULT: ${{ needs.baseline.result }}
          RAN_RUNTIME_ARCHIVE_RESULT: ${{ needs['runtime-archive'].result }}
          RAN_CORE_CONTRACT_RESULT: ${{ needs['core-contract'].result }}
          RAN_REPOSITORY_QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          test "$RAN_BASELINE_RESULT" = success
          test "$RAN_RUNTIME_ARCHIVE_RESULT" = success
          test "$RAN_CORE_CONTRACT_RESULT" = success
          test "$RAN_REPOSITORY_QUALITY_RESULT" = success
